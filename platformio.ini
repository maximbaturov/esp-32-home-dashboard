[platformio]
extra_configs =
  secrets.ini

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
board_build.extra_flags =
	-DDEV_WIFI=1
  -DBUTTON_PIN=14
	-DSDA_PIN=21
	-DSCL_PIN=19
lib_deps = 
	adafruit/Adafruit GFX Library@^1.12.3
	adafruit/Adafruit SSD1306@^2.5.15
	arduino-libraries/Arduino_JSON@^0.2.0

[env:adafruit_qtpy_esp32s3_n4r2]
platform = espressif32
board = adafruit_qtpy_esp32s3_n4r2
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.extra_flags = 
  -DDEV_WIFI=1
  -DBUTTON_PIN=6
  -DSDA_PIN=15
  -DSCL_PIN=5
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCFG_TUD_ENABLED=1
  -DCFG_TUD_MSC=0 
  -DCORE_DEBUG_LEVEL=5
lib_deps = 
	adafruit/Adafruit GFX Library@^1.12.3
	adafruit/Adafruit SSD1306@^2.5.15
	arduino-libraries/Arduino_JSON@^0.2.0


[env:esp32-c6]
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.extra_flags = 
  -DDEV_WIFI=1
  -DBUTTON_PIN=9
  -DSDA_PIN=4
  -DSCL_PIN=5
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCFG_TUD_ENABLED=1
  -DCFG_TUD_MSC=0 
lib_deps = 
	adafruit/Adafruit GFX Library@^1.12.3
	adafruit/Adafruit SSD1306@^2.5.15
	arduino-libraries/Arduino_JSON@^0.2.0